name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Check public repository
        shell: pwsh
        run: ./scripts/Test-Repository.ps1
      - name: Restore locked dependencies
        shell: pwsh
        run: dotnet restore TrackMirror.sln --locked-mode -m:1 -nr:false
      - name: Build
        shell: pwsh
        run: dotnet build TrackMirror.sln --no-restore -c Release -p:ContinuousIntegrationBuild=true -m:1 -nr:false
      - name: Run synthetic integration tests
        shell: pwsh
        run: dotnet test TrackMirror.sln --no-build --no-restore -c Release --logger "trx;LogFileName=integration.trx" --results-directory TestResults -m:1 -nr:false
      - name: Validate release packaging
        shell: pwsh
        run: ./scripts/Build-Release.ps1 -Version 0.0.0-ci -BuildInstaller -OutputDirectory "$env:RUNNER_TEMP/package-check"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 7
