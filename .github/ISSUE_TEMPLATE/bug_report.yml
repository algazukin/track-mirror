name: Bug report
description: Report a problem using synthetic examples.
body:
  - type: markdown
    attributes:
      value: Do not upload real screenshots, databases, OCR text, account identifiers or secrets. See SECURITY.md for vulnerability reporting.
  - type: input
    id: version
    attributes:
      label: Application version and Windows version
      placeholder: Viewer 1.0.0; Windows 11 x64
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use an artificial image or dataset. Include relevant settings without private paths.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Remove usernames, source/data paths, account IDs, tokens and screenshot content.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed personal information and secrets from this report.
          required: true
