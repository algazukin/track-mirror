name: Feature request
description: Suggest a user-facing improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior and alternatives
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Data and privacy considerations
      description: Describe data needed or external services involved. Do not include actual private data.
